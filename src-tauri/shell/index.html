<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarity — AI Video Studio</title>
  <style>
    :root {
      --bg-main: #292929;
      --bg-surface: #1f1f1f;
      --border: #3f3f3f;
      --accent: #6EA4BF;
      --text-primary: #f5f5f5;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: radial-gradient(1200px 600px at 50% -10%, #343434 0%, var(--bg-main) 60%);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .card { text-align: center; max-width: 30rem; padding: 2rem; }

    /*
     * The brand mark ships on a near-black square. `screen` blending makes
     * that background disappear into the splash gradient while the glow and
     * swirl stay intact, so no alpha cutout is needed.
     */
    .mark {
      width: 7rem; height: 7rem; margin: 0 auto 1.5rem; display: block;
      mix-blend-mode: screen;
      animation: breathe 2.6s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(110, 164, 191, 0.22)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 18px rgba(110, 164, 191, 0.45)); }
    }

    h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.08em; }

    .sub {
      font-size: 0.78rem; font-weight: 600; color: var(--accent);
      letter-spacing: 0.14em; text-transform: uppercase; margin: 0.35rem 0 1.75rem;
    }

    .status {
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      font-size: 0.875rem; color: var(--text-muted); min-height: 1.25rem;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
    .dot.busy { animation: blink 1.1s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

    .error {
      display: none; margin-top: 1.5rem; padding: 1rem 1.1rem; text-align: left;
      background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 0.6rem;
    }
    .error.show { display: block; }
    .error h2 { font-size: 0.9rem; color: #fca5a5; margin-bottom: 0.4rem; }
    .error p { font-size: 0.82rem; color: #e2e8f0; line-height: 1.5; word-break: break-word; }
    .error code {
      display: block; margin-top: 0.6rem; padding: 0.5rem 0.6rem; font-size: 0.72rem;
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: 0.35rem;
      color: var(--text-muted); user-select: text; word-break: break-all;
    }

    .actions { display: none; gap: 0.6rem; justify-content: center; margin-top: 1.25rem; }
    .actions.show { display: flex; }

    button {
      font: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer;
      padding: 0.5rem 1.1rem; border-radius: 0.4rem; border: 1px solid transparent;
    }
    .primary { background: var(--accent); color: #10222b; }
    .primary:hover { background: #84b6cf; }
    .ghost { background: transparent; color: var(--text-muted); border-color: var(--border); }
    .ghost:hover { color: var(--text-primary); }
    button:disabled { opacity: 0.5; cursor: default; }

    .progress { margin-top: 1.4rem; text-align: left; }
    .progress .bar {
      height: 6px; border-radius: 999px; overflow: hidden;
      background: var(--bg-surface); border: 1px solid var(--border);
    }
    .progress .fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), #84b6cf);
      transition: width 0.35s ease;
    }
    .progress .row {
      display: flex; justify-content: space-between; gap: 0.75rem;
      margin-top: 0.5rem; font-size: 0.75rem; color: var(--text-muted);
    }
    .progress pre {
      margin-top: 0.75rem; max-height: 8rem; overflow: auto;
      padding: 0.6rem 0.7rem; font-size: 0.68rem; line-height: 1.45;
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: 0.5rem; color: var(--text-muted); white-space: pre-wrap;
      user-select: text;
    }

    .hint { margin-top: 1.6rem; font-size: 0.72rem; color: #6b7280; }
  </style>
</head>
<body>
  <main class="card">
    <img class="mark" src="logo.png" alt="Clarity" />
    <h1>CLARITY</h1>
    <p class="sub">AI Video Studio</p>

    <p class="status">
      <span class="dot busy" id="dot"></span>
      <span id="status">Starting Clarity…</span>
    </p>

    <section class="progress" id="progress" hidden>
      <div class="bar"><div class="fill" id="progress-bar"></div></div>
      <p class="row">
        <span id="progress-percent">0%</span>
        <span id="progress-phase"></span>
      </p>
      <pre id="progress-log" hidden></pre>
    </section>

    <section class="error" id="error" aria-live="polite">
      <h2>Clarity could not start</h2>
      <p id="error-message">Unknown error.</p>
      <code id="error-details" hidden></code>
      <div class="actions show">
        <button class="primary" id="btn-retry" type="button">Retry</button>
        <button class="ghost" id="btn-details" type="button">Show details</button>
      </div>
    </section>

    <p class="hint" id="hint">First launch provisions the AI runtime — this happens once.</p>
  </main>

  <script src="shell.js"></script>
</body>
</html>
